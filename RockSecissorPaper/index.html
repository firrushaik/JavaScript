<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Secissor Paper</title>
    <link rel="stylesheet" href="styles.css" />

</head>
<body>
    <h1 class="heading">Rock Scissor Paper</h1>

    <div class="choices">
        <div class="choice"><img src="images/rock.jpeg" alt="rock" /> </div>
        <div class="choice"><img src="images/scissor.jpeg" /></div>
        <div class="choice"><img src="images/paper.png" /></div>
    </div>

    <div class="score-list">
        <div>
            <p id="user-score">0</p>
            <p>You</p>
        </div>

        <div>
            <p id="computer-score">0</p>
            <p>Computer</p>
        </div>

        <div>
            <p id="draw-score">0</p>
            <p>Draw</p>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
